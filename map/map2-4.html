<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏地图交互 - 节点路径规划</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a1628;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 20px;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.5rem;
    color: #fbbf24;
    text-shadow: 0 0 10px rgba(251,191,36,0.3);
  }
  .map-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 0 auto 20px;
    border: 2px solid #1e3a5f;
    border-radius: 12px;
    overflow: hidden;
    background: #0f1d33;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .map-container img {
    display: block;
    width: 100%;
    height: auto;
  }
  .map-container svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .route-line {
    stroke: #111;
    stroke-width: 2;
    fill: none;
    transition: stroke 0.2s, stroke-width 0.2s;
  }
  .route-hit {
    stroke: transparent;
    stroke-width: 12;
    fill: none;
    pointer-events: all;
    cursor: pointer;
  }
  .route-group:hover .route-line,
  .route-group.selected .route-line {
    stroke: #fbbf24;
    stroke-width: 3.5;
  }
  .route-group.selected .route-line {
    filter: drop-shadow(0 0 4px rgba(251,191,36,0.6));
  }
  .route-arrow {
    stroke: #111;
    stroke-width: 2;
    fill: none;
    transition: stroke 0.2s;
  }
  .route-group:hover .route-arrow,
  .route-group.selected .route-arrow {
    stroke: #fbbf24;
  }
  .point-hit {
    fill: transparent;
    cursor: pointer;
    transition: fill 0.2s;
  }
  .point-hit:hover {
    fill: rgba(255,255,255,0.08);
  }
  .point-group.selected .point-hit {
    fill: rgba(251,191,36,0.12);
  }
  .point-indicator {
    fill: none;
    stroke: #fbbf24;
    stroke-width: 2.5;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .point-group:hover .point-indicator,
  .point-group.selected .point-indicator {
    opacity: 1;
  }
  .point-group.selected .point-indicator {
    stroke-width: 3;
    filter: drop-shadow(0 0 6px rgba(251,191,36,0.8));
  }
  .point-label {
    fill: #fbbf24;
    font-size: 11px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
  .point-group:hover .point-label,
  .point-group.selected .point-label {
    opacity: 1;
  }
  .controls {
    max-width: 900px;
    margin: 0 auto 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    background: #1e3a5f;
    color: #e2e8f0;
    border: 1px solid #2d4a6f;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn:hover {
    background: #2d4a6f;
    border-color: #fbbf24;
  }
  .btn-primary {
    background: #fbbf24;
    color: #0a1628;
    border-color: #fbbf24;
    font-weight: bold;
  }
  .btn-primary:hover {
    background: #f59e0b;
  }
  .stats {
    color: #94a3b8;
    font-size: 13px;
    margin-left: auto;
  }
  .info-panel {
    max-width: 900px;
    margin: 0 auto;
    background: #0f1d33;
    border: 1px solid #1e3a5f;
    border-radius: 12px;
    padding: 16px;
  }
  .info-section {
    margin-bottom: 12px;
  }
  .info-section:last-child {
    margin-bottom: 0;
  }
  .info-title {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .chip-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    background: rgba(251,191,36,0.15);
    color: #fbbf24;
    border: 1px solid rgba(251,191,36,0.3);
  }
  .chip-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .path-card {
    background: rgba(30,58,95,0.5);
    border: 1px solid #2d4a6f;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
  }
  .path-card:last-child {
    margin-bottom: 0;
  }
  .path-node {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
  }
  .path-arrow {
    color: #64748b;
    font-size: 14px;
    margin: 0 2px;
  }
  .empty-state {
    color: #475569;
    font-size: 13px;
    font-style: italic;
  }
</style>
</head>

<div class="info-panel">
  <div class="info-section">
    <div class="info-title">📍 已选点位</div>
    <div class="chip-container" id="selectedPoints">
      <span class="empty-state">点击点位或路线以选择</span>
    </div>
  </div>
  <div class="info-section">
    <div class="info-title">🛤️ 已选路线 (自动合并路径)</div>
    <div id="selectedRoutes">
      <span class="empty-state">点击路线以选择</span>
    </div>
  </div>
</div>

<script>
const pointColors = {"Start": "#d4a017", "A": "#7fff00", "B": "#dda0dd", "C": "#dda0dd", "D": "#7fff00", "E": "#ff4444", "F": "#ff4444", "G": "#7fff00", "H": "#00ffff", "I": "#ff4444", "J": "#00ffff", "K": "#00ffff", "L": "#ff4444", "M": "#ff4444", "N": "#7fff00", "O": "#00ffff", "P": "#ff4444"};
const selectedPoints = new Set();
const selectedRoutes = new Set();

function isNodeUsedByRoutes(node) {
  for (const key of selectedRoutes) {
    const [f, t] = key.split('→');
    if (f === node || t === node) return true;
  }
  return false;
}

function toggleRoute(el) {
  const from = el.dataset.from;
  const to = el.dataset.to;
  const key = from + '→' + to;

  if (selectedRoutes.has(key)) {
    selectedRoutes.delete(key);
    el.classList.remove('selected');
    // 取消路线后，检查两端节点是否仍被其他已选路线使用
    if (!isNodeUsedByRoutes(from)) {
      selectedPoints.delete(from);
      const fromEl = document.querySelector(`.point-group[data-point="${from}"]`);
      if (fromEl) fromEl.classList.remove('selected');
    }
    if (!isNodeUsedByRoutes(to)) {
      selectedPoints.delete(to);
      const toEl = document.querySelector(`.point-group[data-point="${to}"]`);
      if (toEl) toEl.classList.remove('selected');
    }
  } else {
    selectedRoutes.add(key);
    el.classList.add('selected');
    const fromEl = document.querySelector(`.point-group[data-point="${from}"]`);
    const toEl = document.querySelector(`.point-group[data-point="${to}"]`);
    if (fromEl && !selectedPoints.has(from)) {
      selectedPoints.add(from);
      fromEl.classList.add('selected');
    }
    if (toEl && !selectedPoints.has(to)) {
      selectedPoints.add(to);
      toEl.classList.add('selected');
    }
  }
  updateDisplay();
}

function togglePoint(el) {
  const point = el.dataset.point;
  if (selectedPoints.has(point)) {
    selectedPoints.delete(point);
    el.classList.remove('selected');
  } else {
    selectedPoints.add(point);
    el.classList.add('selected');
  }
  updateDisplay();
}

function resetAll() {
  selectedPoints.clear();
  selectedRoutes.clear();
  document.querySelectorAll('.point-group, .route-group')
    .forEach(g => g.classList.remove('selected'));
  updateDisplay();
}

function selectAll() {
  document.querySelectorAll('.route-group').forEach(el => {
    const key = el.dataset.from + '→' + el.dataset.to;
    if (!selectedRoutes.has(key)) {
      selectedRoutes.add(key);
      el.classList.add('selected');
      const from = el.dataset.from;
      const to = el.dataset.to;
      const fromEl = document.querySelector(`.point-group[data-point="${from}"]`);
      const toEl = document.querySelector(`.point-group[data-point="${to}"]`);
      if (fromEl && !selectedPoints.has(from)) {
        selectedPoints.add(from);
        fromEl.classList.add('selected');
      }
      if (toEl && !selectedPoints.has(to)) {
        selectedPoints.add(to);
        toEl.classList.add('selected');
      }
    }
  });
  updateDisplay();
}

function buildPaths() {
  const edges = [];
  selectedRoutes.forEach(key => {
    const [from, to] = key.split('→');
    edges.push({ from, to });
  });

  if (edges.length === 0) return [];

  const adj = {};
  const inDeg = {};
  edges.forEach(e => {
    if (!adj[e.from]) adj[e.from] = [];
    adj[e.from].push(e.to);
    inDeg[e.to] = (inDeg[e.to] || 0) + 1;
  });

  const starts = new Set();
  edges.forEach(e => {
    if ((inDeg[e.from] || 0) === 0) starts.add(e.from);
  });

  const paths = [];
  function follow(node, path, usedEdges) {
    const nexts = adj[node] || [];
    if (nexts.length === 0) {
      paths.push([...path]);
      return;
    }
    nexts.forEach(next => {
      const edgeKey = node + '→' + next;
      if (usedEdges.has(edgeKey)) return;
      const newUsed = new Set(usedEdges);
      newUsed.add(edgeKey);
      follow(next, [...path, next], newUsed);
    });
  }
  starts.forEach(s => follow(s, [s], new Set()));

  if (paths.length === 0 && edges.length > 0) {
    follow(edges[0].from, [edges[0].from], new Set());
  }

  return paths;
}

function updateDisplay() {
  document.getElementById('stats').textContent = 
    `已选点位: ${selectedPoints.size} | 已选路线: ${selectedRoutes.size}`;

  const pointsContainer = document.getElementById('selectedPoints');
  if (selectedPoints.size === 0) {
    pointsContainer.innerHTML = '<span class="empty-state">点击点位或路线以选择</span>';
  } else {
    pointsContainer.innerHTML = Array.from(selectedPoints).sort().map(p => {
      const color = pointColors[p] || '#ccc';
      return `<span class="chip"><span class="chip-dot" style="background:${color}"></span>${p}</span>`;
    }).join('');
  }

  const routesContainer = document.getElementById('selectedRoutes');
  const paths = buildPaths();
  if (paths.length === 0) {
    routesContainer.innerHTML = '<span class="empty-state">点击路线以选择</span>';
  } else {
    routesContainer.innerHTML = paths.map(path => {
      return `<div class="path-card">${path.map((node, i) => {
        const color = pointColors[node] || '#ccc';
        const arrow = i < path.length - 1 ? '<span class="path-arrow">→</span>' : '';
        return `<span class="path-node"><span class="chip-dot" style="background:${color}"></span>${node}</span>${arrow}`;
      }).join('')}</div>`;
    }).join('');
  }
}
</script>
