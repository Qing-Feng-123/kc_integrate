<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map 1000101133 - 交互地图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a1628;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #e0e6ed;
  }
  h1 { margin-bottom: 16px; font-size: 18px; text-align: center; }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .controls button {
    padding: 8px 20px;
    border: 1px solid #2a4365;
    background: #1a2b4a;
    color: #90cdf4;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .controls button:hover { background: #2a4365; }

  .map-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    border: 2px solid #1a365d;
    border-radius: 8px;
    overflow: hidden;
    background: #0d1b2a;
  }
  .map-container img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  .map-container svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  .route-group { cursor: pointer; }
  .route-visible {
    stroke: #111;
    stroke-width: 2;
    fill: none;
    pointer-events: none;
    transition: stroke 0.2s, stroke-width 0.2s;
  }
  .route-arrow {
    stroke: #111;
    stroke-width: 2;
    fill: none;
    pointer-events: none;
    transition: stroke 0.2s, stroke-width 0.2s;
  }
  .route-hit {
    stroke: transparent;
    stroke-width: 20;
    fill: none;
    pointer-events: all;
    cursor: pointer;
  }
  .route-group.selected .route-visible {
    stroke: #fbbf24;
    stroke-width: 3.5;
  }
  .route-group.selected .route-arrow {
    stroke: #fbbf24;
    stroke-width: 3.5;
  }
  .route-group:hover .route-visible { stroke: #fbbf24; }
  .route-group:hover .route-arrow { stroke: #fbbf24; }

  .point-group { cursor: pointer; }
  .hit-area {
    pointer-events: all;
    fill: transparent;
    stroke: none;
    transition: fill 0.2s;
  }
  .hit-area:hover { fill: rgba(255,255,255,0.08); }
  .indicator {
    pointer-events: none;
    fill: none;
    stroke-width: 2;
    opacity: 0;
    transition: opacity 0.2s, stroke-width 0.2s;
  }
  .point-group:hover .indicator,
  .point-group.selected .indicator {
    opacity: 1;
    stroke-width: 3;
  }
  .point-tag {
    font-size: 13px;
    font-weight: bold;
    fill: white;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  }
  .point-group:hover .point-tag,
  .point-group.selected .point-tag { opacity: 1; }
  .point-group.selected .hit-area {
    fill: rgba(251, 191, 36, 0.12);
    stroke: rgba(251, 191, 36, 0.5);
    stroke-width: 1.5;
  }

  .selection-panel {
    margin-top: 16px;
    background: #1a2b4a;
    border: 1px solid #2a4365;
    border-radius: 8px;
    padding: 16px 20px;
    max-width: 900px;
    width: 100%;
  }
  .panel-section { margin-bottom: 16px; }
  .panel-section:last-child { margin-bottom: 0; }
  .panel-title {
    font-size: 13px;
    color: #90cdf4;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #2a4365;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-title .count {
    background: #2a4365;
    color: #e0e6ed;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
  }
  .chip-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 32px;
  }
  .chip-grid:empty::before {
    content: "点击地图上的点位或路线以添加…";
    color: #4a5568;
    font-size: 13px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .chip:hover { opacity: 0.7; transform: scale(0.95); }
  .chip-point {
    background: rgba(251, 191, 36, 0.12);
    border-color: rgba(251, 191, 36, 0.4);
    color: #fbbf24;
  }
  .chip-route {
    background: rgba(96, 165, 250, 0.12);
    border-color: rgba(96, 165, 250, 0.4);
    color: #60a5fa;
  }
  .chip .remove { font-size: 15px; line-height: 1; }

  .path-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .path-item {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    padding: 6px 12px;
    background: rgba(96, 165, 250, 0.08);
    border: 1px solid rgba(96, 165, 250, 0.25);
    border-radius: 8px;
    font-size: 14px;
    color: #bfdbfe;
  }
  .path-node {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
  }
  .path-arrow {
    color: #60a5fa;
    font-size: 12px;
    margin: 0 2px;
  }
  .path-empty {
    color: #4a5568;
    font-size: 13px;
    padding: 4px 0;
  }

  .legend {
    margin-top: 12px;
    font-size: 12px;
    color: #4a5568;
    line-height: 1.6;
  }
</style>
</head>

<div class="selection-panel">
  <div class="panel-section">
    <div class="panel-title">
      📍 已选点位
      <span class="count" id="pointCount">0</span>
    </div>
    <div class="chip-grid" id="pointGrid"></div>
  </div>

  <div class="panel-section">
    <div class="panel-title">
      🛤️ 已选路线
      <span class="count" id="routeCount">0</span>
    </div>
    <div class="path-list" id="pathList"></div>
  </div>

  <div class="legend">
    点击地图上的点位或路线进行选中。点击路线时，其起点和终点会自动点亮。
    首尾相连的路线会自动合并为完整路径；分叉路线会拆分为多条独立路径。
    点击此处标签可取消选中。
  </div>
</div>

<script>
  const selectedPoints = new Set();
  const selectedRoutes = new Set();

  const pointColors = {
    'A': '#7CFC00', 'B': '#FF4444', 'C': '#00E5FF',
    'D': '#FF4444', 'E': '#FF4444', 'F': '#7CFC00',
    'G': '#FF4444', 'H': '#00E5FF', 'I': '#00E5FF',
    'J': '#7CFC00', 'K': '#FF2222'
  };

  function togglePoint(el) {
    const name = el.dataset.name;
    if (selectedPoints.has(name)) {
      selectedPoints.delete(name);
      el.classList.remove('selected');
    } else {
      selectedPoints.add(name);
      el.classList.add('selected');
    }
    renderSelection();
  }

  function toggleRoute(el) {
    const from = el.dataset.from;
    const to = el.dataset.to;
    const key = from + '→' + to;

    if (selectedRoutes.has(key)) {
      selectedRoutes.delete(key);
      el.classList.remove('selected');
    } else {
      selectedRoutes.add(key);
      el.classList.add('selected');
      if (!selectedPoints.has(from)) {
        selectedPoints.add(from);
        const fromEl = document.querySelector('.point-group[data-name="' + from + '"]');
        if (fromEl) fromEl.classList.add('selected');
      }
      if (!selectedPoints.has(to)) {
        selectedPoints.add(to);
        const toEl = document.querySelector('.point-group[data-name="' + to + '"]');
        if (toEl) toEl.classList.add('selected');
      }
    }
    renderSelection();
  }

  function resetAll() {
    selectedPoints.clear();
    selectedRoutes.clear();
    document.querySelectorAll('.point-group').forEach(g => g.classList.remove('selected'));
    document.querySelectorAll('.route-group').forEach(g => g.classList.remove('selected'));
    renderSelection();
  }

  function deselectPoint(name) {
    selectedPoints.delete(name);
    const el = document.querySelector('.point-group[data-name="' + name + '"]');
    if (el) el.classList.remove('selected');
    renderSelection();
  }

  function deselectRoute(from, to) {
    const key = from + '→' + to;
    selectedRoutes.delete(key);
    const el = document.querySelector('.route-group[data-from="' + from + '"][data-to="' + to + '"]');
    if (el) el.classList.remove('selected');
    renderSelection();
  }

  function buildPaths() {
    if (selectedRoutes.size === 0) return [];

    const edges = [];
    selectedRoutes.forEach(key => {
      const [from, to] = key.split('→');
      edges.push({ from, to });
    });

    const adj = {};
    const inDeg = {};
    const outDeg = {};
    edges.forEach(e => {
      if (!adj[e.from]) adj[e.from] = [];
      adj[e.from].push(e.to);
      outDeg[e.from] = (outDeg[e.from] || 0) + 1;
      inDeg[e.to] = (inDeg[e.to] || 0) + 1;
    });

    const starts = new Set();
    edges.forEach(e => {
      const ind = inDeg[e.from] || 0;
      if (ind === 0 || ind >= 2) starts.add(e.from);
    });

    const paths = [];

    function follow(node, path, usedEdges) {
      const nexts = adj[node] || [];
      if (nexts.length === 0) {
        paths.push([...path]);
        return;
      }
      nexts.forEach(next => {
        const edgeKey = node + '→' + next;
        if (usedEdges.has(edgeKey)) return;
        const newUsed = new Set(usedEdges);
        newUsed.add(edgeKey);
        follow(next, [...path, next], newUsed);
      });
    }

    starts.forEach(start => {
      follow(start, [start], new Set());
    });

    if (paths.length === 0 && edges.length > 0) {
      follow(edges[0].from, [edges[0].from], new Set());
    }

    return paths;
  }

  function renderSelection() {
    const pointGrid = document.getElementById('pointGrid');
    pointGrid.innerHTML = '';
    selectedPoints.forEach(name => {
      const chip = document.createElement('span');
      chip.className = 'chip chip-point';
      chip.innerHTML = name + ' <span class="remove">×</span>';
      chip.onclick = () => deselectPoint(name);
      pointGrid.appendChild(chip);
    });
    document.getElementById('pointCount').textContent = selectedPoints.size;

    const pathList = document.getElementById('pathList');
    pathList.innerHTML = '';

    const paths = buildPaths();
    document.getElementById('routeCount').textContent = paths.length;

    if (paths.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'path-empty';
      empty.textContent = '点击地图上的路线以添加…';
      pathList.appendChild(empty);
    } else {
      paths.forEach(path => {
        const item = document.createElement('div');
        item.className = 'path-item';
        path.forEach((node, i) => {
          const dot = document.createElement('span');
          dot.className = 'path-node';
          dot.style.background = pointColors[node] || '#666';
          dot.textContent = node;
          item.appendChild(dot);
          if (i < path.length - 1) {
            const arrow = document.createElement('span');
            arrow.className = 'path-arrow';
            arrow.textContent = '→';
            item.appendChild(arrow);
          }
        });
        pathList.appendChild(item);
      });
    }
  }
</script>
